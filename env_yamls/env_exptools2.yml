# Create your env first with all the dependencies
# conda env create -n exptools2 -f env_exptools2.yml

# Install exptools2 option1: 
# pip install git+https://github.com/VU-Cog-Sci/exptools2/

# Install exptools2 option2:
# (1): cd /somewhere/your_package_software_folder
# (2): git clone git@github.com:VU-Cog-Sci/exptools2.git
# (3): cd exptools2
# (4): pip install -e .

# Install pylink
# pip install sr-research-pylink

name: exptools2
channels:
- conda-forge
- defaults
dependencies:
- python=3.10
- pip
- numpy 
- scipy 
- matplotlib 
- pandas 
- pyopengl 
- pillow 
- lxml 
- openpyxl 
- xlrd 
- configobj 
- pyyaml 
- gevent 
- greenlet 
- msgpack-python 
- psutil 
- pytables 
- 'requests[security]' 
- cffi 
- seaborn 
- wxPython 
- cython 
- pyzmq 
- pyserial 
- qt 
- pyqt
- pyglet 
- pysoundfile 
- python-bidi 
- moviepy 
- pyosf

- pip:
  - zmq 
  - json-tricks 
  - pyparallel 
  - sounddevice 
  - pygame 
  - pysoundcard
  - psychopy-sounddevice
  - psychopy_ext 
  - psychopy
